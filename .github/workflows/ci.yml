name: CI

on:
  # Changes to documentation alone are checked by the docs workflow.
  push:
    branches: [main]
    paths-ignore: &docs ["**.md", LICENSE]
  pull_request:
    paths-ignore: *docs
  # The release workflow runs these checks on the tagged commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run docs:check
      - run: bun run typecheck
      # Downloads the pinned spec sources and compares the output with
      # src/spec/generated (ARCHITECTURE §11).
      - run: bun run spec:check
      - run: bun run build
      - run: npm pack --dry-run

  test-node:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: bun run test:node

  test-bun:
    name: Test (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.2.23", latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Older Bun versions cannot read the current bun.lock format, so
      # dependencies are installed with the project's Bun version first.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version
      # --bun runs vitest on the Bun runtime instead of Node.js.
      - run: bun --bun run test:node

  test-deno:
    name: Test (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Vite fails to start on Deno 2.6 (no parseEnv in node:util); 2.9 works.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno --version
      # Runs vitest and its test workers on Deno instead of Node.js.
      - run: deno run --allow-all npm:vitest run --project node

  test-browser:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image has the browsers and their system packages preinstalled, so the
    # job does not depend on the Ubuntu apt mirrors. Its version must match the
    # playwright package (ARCHITECTURE §8).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun needs unzip, which the image does not have, so Bun is
      # installed from npm in the version from packageManager.
      - name: Install Bun
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global --prefix "$HOME/.bun-npm" "bun@$version"
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"
      - run: node --version && bun --version
      - run: bun install --frozen-lockfile
      - run: bun run test:browser --browser "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
